<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elmarie Mariano | Personal Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f4f7fb;
        }

        /* Navigation */
        nav {
            background: #12355b;
            padding: 15px 8%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #8fd3ff;
        }

        /* Home */
        #home {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #dceeff, #ffffff);
        }

        .hero {
            max-width: 800px;
        }

        .profile-picture {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 45px;
            color: #12355b;
            margin-bottom: 10px;
        }

        .hero h3 {
            color: #456;
            margin-bottom: 15px;
        }

        .hero p {
            max-width: 650px;
            margin: auto;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #12355b;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .button:hover {
            background: #1c568f;
        }

        /* General Sections */
        section {
            padding: 70px 8%;
        }

        section h2 {
            text-align: center;
            color: #12355b;
            font-size: 32px;
            margin-bottom: 30px;
        }

        .content {
            max-width: 900px;
            margin: auto;
        }

        /* About */
        #about p {
            text-align: center;
            font-size: 18px;
        }

        /* Skills */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .skill {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .skill h3 {
            color: #12355b;
            margin-bottom: 10px;
        }

        /* Projects */
        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: auto;
        }

        .project {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .project h3 {
            color: #12355b;
            margin-bottom: 10px;
        }

        /* Education */
        .education {
            background: white;
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .education h3 {
            color: #12355b;
            margin-bottom: 10px;
        }

        /* Contact */
        #contact {
            background: #eaf3fb;
        }

        .contact-info {
            text-align: center;
            font-size: 18px;
        }

        .contact-info p {
            margin: 10px;
        }

        /* Footer */
        footer {
            background: #12355b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
